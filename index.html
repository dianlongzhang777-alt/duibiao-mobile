<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#f4f5f7" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="对标监控" />
<title>对标账号监控 · 生意经</title>
<script src="data.js"></script>
<style>
  :root {
    --bg: #f4f5f7;
    --card: #ffffff;
    --border: #e6e8eb;
    --text: #1f2329;
    --muted: #8f959e;
    --accent: #3370ff;
    --accent-soft: #e8f0ff;
    --selected: #1f2329;
    --dot: #3370ff;
    --radius: 12px;
    --shadow: 0 1px 2px rgba(0,0,0,.04), 0 4px 14px rgba(0,0,0,.04);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB",
      "Microsoft YaHei", "Noto Sans SC", sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 13px;
    line-height: 1.5;
    min-height: 100%;
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }

  .page {
    max-width: 1240px;
    margin: 0 auto;
    padding: 18px 18px 40px;
  }
  .page-title {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; flex-wrap: wrap;
    margin-bottom: 14px;
  }
  .page-title h1 {
    margin: 0; font-size: 18px; font-weight: 650;
  }
  .page-title .meta { color: var(--muted); font-size: 12px; }
  .title-left { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }

  .btn-ghost {
    border: 1px solid var(--border);
    background: #fff;
    border-radius: 8px;
    padding: 5px 12px;
    font-size: 12px;
    cursor: pointer;
    color: var(--text);
  }
  .btn-ghost:hover { background: #f7f8fa; }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
  }

  /* Primary: calendar + day detail */
  .main-grid {
    display: grid;
    grid-template-columns: 320px 1fr;
    gap: 14px;
    margin-bottom: 16px;
    align-items: start;
  }
  @media (max-width: 900px) {
    .main-grid { grid-template-columns: 1fr; }
  }

  /* Calendar */
  .cal-card { padding: 14px 14px 12px; }
  .cal-hd {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 12px;
  }
  .cal-hd h2 {
    margin: 0; font-size: 15px; font-weight: 650;
    letter-spacing: 0.02em;
  }
  .cal-nav { display: flex; gap: 6px; }
  .cal-nav button {
    width: 30px; height: 30px;
    border: 1px solid var(--border);
    background: #fff;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    color: var(--text);
    line-height: 1;
  }
  .cal-nav button:hover { background: #f5f6f8; }
  .cal-weekdays {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 2px;
    margin-bottom: 4px;
  }
  .cal-weekdays span {
    text-align: center;
    font-size: 11px;
    color: var(--muted);
    padding: 4px 0;
    font-weight: 500;
  }
  .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 2px;
  }
  .cal-cell {
    aspect-ratio: 1;
    border: none;
    background: transparent;
    border-radius: 10px;
    cursor: default;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    color: var(--muted);
    font-size: 13px;
    font-variant-numeric: tabular-nums;
    padding: 0;
  }
  .cal-cell.in-month {
    color: var(--text);
    cursor: pointer;
  }
  .cal-cell.in-month:hover { background: #f5f6f8; }
  .cal-cell.has-data .day-num { font-weight: 600; }
  .cal-cell.selected {
    background: var(--selected) !important;
    color: #fff !important;
  }
  .cal-cell.selected .dot { background: #fff; }
  .cal-cell.today:not(.selected) {
    box-shadow: inset 0 0 0 1.5px var(--accent);
  }
  .cal-cell .dot {
    width: 5px; height: 5px;
    border-radius: 50%;
    background: var(--dot);
    flex-shrink: 0;
  }
  .cal-cell .dot.empty { visibility: hidden; }
  .cal-legend {
    margin-top: 12px;
    padding-top: 10px;
    border-top: 1px solid #f0f1f3;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    color: var(--muted);
    font-size: 11px;
  }
  .cal-legend .mark {
    display: inline-flex; align-items: center; gap: 5px;
  }
  .cal-legend .mark i {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--dot); display: inline-block;
  }

  /* Day detail */
  .day-card { min-height: 420px; display: flex; flex-direction: column; }
  .day-hd {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 16px 8px;
    border-bottom: 1px solid #f0f1f3;
  }
  .day-hd h2 {
    margin: 0; font-size: 14px; font-weight: 650;
    display: flex; align-items: center; gap: 8px;
  }
  .date-pill {
    background: #1f2329; color: #fff;
    font-size: 12px; font-weight: 600;
    padding: 2px 10px; border-radius: 999px;
  }
  .kpis {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    padding: 14px 16px 10px;
  }
  @media (max-width: 640px) {
    .kpis { grid-template-columns: repeat(2, 1fr); }
  }
  .kpi {
    background: #fafbfc;
    border: 1px solid #f0f1f3;
    border-radius: 10px;
    padding: 12px 10px;
    text-align: center;
  }
  .kpi .n {
    font-size: 24px; font-weight: 700; letter-spacing: -0.5px;
    font-variant-numeric: tabular-nums;
  }
  .kpi .l { color: var(--muted); font-size: 11px; margin-top: 2px; }

  .day-posts {
    padding: 4px 10px 14px;
    flex: 1;
    overflow: auto;
    max-height: min(560px, calc(100vh - 280px));
  }
  .day-post {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 6px 12px;
    padding: 11px 8px;
    border-bottom: 1px dashed #eef0f2;
  }
  .day-post:last-child { border-bottom: none; }
  .day-post .title {
    font-weight: 550; color: var(--text);
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .day-post .sub {
    color: var(--muted); font-size: 12px;
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
    margin-top: 3px;
  }
  .tag-new {
    background: #e8f8ef; color: #2ea56a;
    font-size: 11px; padding: 1px 6px; border-radius: 4px; font-weight: 600;
  }
  .metrics {
    color: var(--muted); font-size: 12px;
    display: flex; flex-wrap: wrap; gap: 8px;
    font-variant-numeric: tabular-nums;
    justify-content: flex-end; text-align: right;
    align-content: flex-start;
  }
  .metrics span { white-space: nowrap; }
  .empty-hint {
    color: var(--muted); padding: 36px 16px; text-align: center;
  }
  .empty-hint strong { color: var(--text); display: block; margin-bottom: 6px; }

  /* Secondary tabs */
  .sec-tabs {
    display: flex; gap: 4px;
    margin: 8px 0 12px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 0;
  }
  .sec-tabs button {
    border: none; background: transparent;
    padding: 10px 14px;
    font-size: 13px; font-weight: 550;
    color: var(--muted);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
  }
  .sec-tabs button.active {
    color: var(--text);
    border-bottom-color: var(--accent);
  }
  .sec-panel { display: none; }
  .sec-panel.active { display: block; }

  .section-title {
    margin: 0 0 10px;
    font-size: 13px; font-weight: 650;
    display: flex; align-items: center; gap: 8px;
  }
  .section-title .hint { font-weight: 400; color: var(--muted); font-size: 12px; }

  .cat-block { margin-bottom: 12px; overflow: hidden; }
  .cat-hd {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 14px; font-weight: 650; font-size: 13px;
  }
  .cat-hd .right { font-weight: 500; font-size: 12px; opacity: .85; }
  table.acct {
    width: 100%; border-collapse: collapse;
    font-size: 12.5px;
  }
  table.acct th {
    text-align: left; color: var(--muted); font-weight: 500;
    padding: 8px 12px; border-bottom: 1px solid var(--border);
    background: #fafbfc;
  }
  table.acct td {
    padding: 9px 12px; border-bottom: 1px solid #f0f1f3;
    vertical-align: middle;
  }
  table.acct tr:last-child td { border-bottom: none; }
  table.acct tr:hover td { background: #fafbfc; }
  .acct-name { font-weight: 550; }
  .acct-id { color: var(--muted); font-size: 11px; }
  .ops a {
    display: inline-block;
    margin-right: 6px;
    padding: 2px 8px;
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-size: 11px;
    background: #fff;
  }
  .ops a:hover { border-color: var(--accent); color: var(--accent); text-decoration: none; }
  .dash { color: #c0c4cc; }

  .filters {
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
    margin-bottom: 10px;
  }
  .seg {
    display: inline-flex; background: #fff; border: 1px solid var(--border);
    border-radius: 8px; overflow: hidden;
  }
  .seg button {
    border: none; background: transparent; padding: 6px 12px;
    font-size: 12px; cursor: pointer; color: var(--muted);
    min-height: 36px;
  }
  .seg button.active { background: #1f2329; color: #fff; }
  .seg button + button { border-left: 1px solid var(--border); }
  .seg button.active + button,
  .seg button + button.active { border-left-color: transparent; }

  .day-sort-bar {
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
    padding: 0 16px 10px;
  }
  .day-sort-bar .day-sort-label {
    color: var(--muted); font-size: 12px; font-weight: 550;
  }

  .feed { display: flex; flex-direction: column; gap: 8px; }
  .feed-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    box-shadow: var(--shadow);
  }
  .feed-card .cap {
    font-size: 13px; font-weight: 500; margin-bottom: 6px;
    white-space: pre-wrap; word-break: break-word;
  }
  .feed-card .meta-row {
    display: flex; flex-wrap: wrap; gap: 10px;
    color: var(--muted); font-size: 12px; margin-bottom: 6px;
  }
  .feed-card .mrow {
    display: flex; flex-wrap: wrap; gap: 12px;
    font-variant-numeric: tabular-nums; font-size: 12px; color: #5c626b;
  }

  .footer-note {
    margin-top: 24px; text-align: center; color: var(--muted); font-size: 11px;
  }

  /* Top mode switch: 对标 / 生意经 */
  .mode-seg {
    display: inline-flex;
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
  }
  .mode-seg button {
    border: none; background: transparent;
    padding: 7px 16px;
    font-size: 13px; font-weight: 600;
    cursor: pointer; color: var(--muted);
  }
  .mode-seg button.active { background: #1f2329; color: #fff; }
  .mode-seg button + button { border-left: 1px solid var(--border); }
  .mode-seg button.active + button,
  .mode-seg button + button.active { border-left-color: transparent; }
  .mode-panel { display: none; }
  .mode-panel.active { display: block; }

  /* 生意经 */
  .sy-meta-row {
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
    margin-bottom: 12px; color: var(--muted); font-size: 12px;
  }
  .sy-pill {
    display: inline-flex; align-items: center; gap: 4px;
    background: var(--accent-soft); color: var(--accent);
    padding: 2px 10px; border-radius: 999px; font-weight: 600; font-size: 11px;
  }
  .sy-pill.dark {
    background: #1f2329; color: #fff;
  }
  .sy-chips {
    display: flex; flex-wrap: wrap; gap: 6px;
    margin-bottom: 12px;
  }
  .sy-chips button {
    border: 1px solid var(--border);
    background: #fff;
    border-radius: 999px;
    padding: 5px 12px;
    font-size: 12px; font-weight: 550;
    cursor: pointer; color: var(--text);
  }
  .sy-chips button:hover { background: #f7f8fa; }
  .sy-chips button.active {
    background: var(--accent); color: #fff; border-color: var(--accent);
  }
  .sy-lists {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  @media (max-width: 900px) {
    .sy-lists { grid-template-columns: 1fr; }
  }
  .sy-col { padding: 0; overflow: hidden; }
  .sy-col-hd {
    padding: 10px 14px;
    font-weight: 650; font-size: 13px;
    border-bottom: 1px solid #f0f1f3;
    display: flex; align-items: center; justify-content: space-between;
  }
  .sy-col-hd .badge {
    font-size: 11px; font-weight: 600;
    background: var(--accent-soft); color: var(--accent);
    padding: 1px 8px; border-radius: 999px;
  }
  .sy-row {
    display: grid;
    grid-template-columns: 28px 1fr;
    gap: 8px;
    padding: 11px 12px;
    border-bottom: 1px dashed #eef0f2;
  }
  .sy-row:last-child { border-bottom: none; }
  .sy-rank {
    font-weight: 700; font-variant-numeric: tabular-nums;
    color: var(--muted); font-size: 14px; padding-top: 2px;
  }
  .sy-rank.top { color: var(--accent); }
  .sy-row .title {
    font-weight: 550; color: var(--text);
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden; margin-bottom: 3px;
  }
  .sy-row .sub {
    color: var(--muted); font-size: 12px;
    display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center;
  }
  .sy-row .idx {
    display: flex; flex-wrap: wrap; gap: 8px;
    margin-top: 5px;
    font-variant-numeric: tabular-nums; font-size: 12px; color: #5c626b;
  }
  .sy-row .idx b { color: var(--text); font-weight: 600; }
  .rank-label {
    font-size: 10px; font-weight: 650;
    background: #fff4e8; color: #c47a20;
    padding: 0 5px; border-radius: 4px;
  }
  .sy-role {
    font-size: 10px; font-weight: 650;
    padding: 0 5px; border-radius: 4px;
  }
  .sy-role.daren { background: #eef2ff; color: #3b5bdb; }
  .sy-role.shangjia { background: #e6f7ed; color: #0f7a45; }
  .sy-col.sy-total { grid-column: 1 / -1; }

  /* —— Mobile / foldable (OPPO Find N2 ~360–412px folded) —— */
  @media (max-width: 640px) {
    .page {
      padding: 10px 10px calc(28px + env(safe-area-inset-bottom, 0px));
      padding-left: max(10px, env(safe-area-inset-left, 0px));
      padding-right: max(10px, env(safe-area-inset-right, 0px));
    }
    .page-title {
      position: sticky; top: 0; z-index: 20;
      background: rgba(244,245,247,.92);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      margin: -10px -10px 10px;
      padding: 10px 10px 8px;
      border-bottom: 1px solid var(--border);
    }
    .page-title h1 { font-size: 16px; }
    .page-title .meta { display: none; }
    .mode-seg button { padding: 8px 18px; font-size: 14px; min-height: 36px; }
    .btn-ghost { padding: 8px 12px; min-height: 36px; }
    .main-grid { gap: 10px; margin-bottom: 12px; }
    .cal-card { padding: 12px 10px 10px; }
    .cal-cell { border-radius: 8px; font-size: 12px; min-height: 40px; aspect-ratio: auto; height: 44px; }
    .day-card { min-height: 0; }
    .day-hd { padding: 10px 12px 8px; flex-wrap: wrap; gap: 6px; }
    .kpis { padding: 10px 12px 8px; gap: 6px; }
    .kpi { padding: 10px 8px; }
    .kpi .n { font-size: 20px; }
    .day-sort-bar { padding: 0 12px 10px; }
    .day-sort-bar .seg button { padding: 8px 12px; font-size: 13px; min-height: 40px; }
    .filters .seg button { padding: 8px 12px; font-size: 13px; min-height: 40px; }
    .day-posts {
      max-height: none;
      padding: 4px 8px 12px;
    }
    .day-post {
      grid-template-columns: 1fr;
      gap: 4px;
    }
    .metrics { justify-content: flex-start; text-align: left; }
    .sec-tabs { margin: 4px 0 10px; overflow-x: auto; -webkit-overflow-scrolling: touch; }
    .sec-tabs button { padding: 10px 12px; white-space: nowrap; }
    .sy-chips {
      flex-wrap: nowrap;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      padding-bottom: 4px;
      margin-bottom: 8px;
      scrollbar-width: none;
    }
    .sy-chips::-webkit-scrollbar { display: none; }
    .sy-chips button {
      flex: 0 0 auto;
      padding: 8px 14px;
      font-size: 13px;
      min-height: 36px;
    }
    .sy-row {
      grid-template-columns: 24px 1fr;
      padding: 10px 8px;
    }
    .sy-lists { gap: 10px; }
    .filters { gap: 6px; }
    .seg button { padding: 8px 10px; min-height: 36px; }
    table.acct { font-size: 12px; display: block; overflow-x: auto; -webkit-overflow-scrolling: touch; }
    .footer-note { font-size: 10px; padding: 0 4px; }
  }
  @media (max-width: 400px) {
    .page-title h1 { font-size: 15px; }
    .kpi .n { font-size: 18px; }
    .date-pill { font-size: 11px; padding: 2px 8px; }
  }
</style>
</head>
<body>
<div class="page">
  <div class="page-title">
    <div class="title-left">
      <h1>对标账号监控</h1>
      <div class="mode-seg" role="tablist" aria-label="视图切换">
        <button type="button" class="active" data-mode="duibiao" role="tab">对标</button>
        <button type="button" data-mode="shengyijing" role="tab">生意经</button>
      </div>
      <span class="meta" id="genMeta"></span>
    </div>
    <button class="btn-ghost" type="button" id="btnRefresh" title="重新渲染当前数据">刷新视图</button>
  </div>

  <div class="mode-panel active" id="mode-duibiao">
  <div class="main-grid">
    <aside class="card cal-card" aria-label="日历">
      <div class="cal-hd">
        <h2 id="calMonthLabel">—</h2>
        <div class="cal-nav">
          <button type="button" id="calPrev" title="上一月">‹</button>
          <button type="button" id="calToday" title="回到有数据的最近一月" style="width:auto;padding:0 10px;font-size:12px;">本月</button>
          <button type="button" id="calNext" title="下一月">›</button>
        </div>
      </div>
      <div class="cal-weekdays">
        <span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span>
      </div>
      <div class="cal-grid" id="calGrid"></div>
      <div class="cal-legend">
        <span class="mark"><i></i> 有早报数据</span>
        <span id="calStat"></span>
      </div>
    </aside>

    <section class="card day-card" id="briefCard">
      <div class="day-hd">
        <h2>当日采集 <span class="date-pill" id="briefDate">—</span></h2>
        <span class="meta" id="dayHint" style="color:var(--muted);font-size:12px;"></span>
      </div>
      <div class="kpis" id="kpis"></div>
      <div class="day-sort-bar" id="daySortBar">
        <span class="day-sort-label">排序</span>
        <div class="seg" id="daySortSeg" role="group" aria-label="当日作品排序">
          <button type="button" data-sort="latest" class="active">时间新→旧</button>
          <button type="button" data-sort="plays">播放量高→低</button>
          <button type="button" data-sort="interactions">互动量高→低</button>
        </div>
      </div>
      <div class="day-posts" id="dayPosts"></div>
    </section>
  </div>

  <div class="sec-tabs" role="tablist">
    <button type="button" class="active" data-tab="library" role="tab">对标账号库</button>
    <button type="button" data-tab="feed" role="tab">作品流</button>
  </div>

  <div class="sec-panel active" id="panel-library" role="tabpanel">
    <div class="section-title">
      账号库
      <span class="hint" id="libHint"></span>
    </div>
    <div id="categories"></div>
  </div>

  <div class="sec-panel" id="panel-feed" role="tabpanel">
    <div class="section-title">
      作品流
      <span class="hint">全部入库作品 · 可筛选排序（相对所选日期）</span>
    </div>
    <div class="filters">
      <div class="seg" id="rangeSeg">
        <button type="button" data-range="all" class="active">全部</button>
        <button type="button" data-range="7">近7天</button>
        <button type="button" data-range="30">近30天</button>
      </div>
      <div class="seg" id="sortSeg" role="group" aria-label="作品流排序">
        <button type="button" data-sort="latest" class="active">时间新→旧</button>
        <button type="button" data-sort="plays">播放量高→低</button>
        <button type="button" data-sort="interactions">互动量高→低</button>
      </div>
      <span class="hint" id="feedCount" style="color:var(--muted);font-size:12px;"></span>
    </div>
    <div class="feed" id="feed"></div>
  </div>

  </div><!-- /mode-duibiao -->

  <div class="mode-panel" id="mode-shengyijing">
    <div class="main-grid">
      <aside class="card cal-card" aria-label="生意经日历">
        <div class="cal-hd">
          <h2 id="syCalMonthLabel">—</h2>
          <div class="cal-nav">
            <button type="button" id="syCalPrev" title="上一月">‹</button>
            <button type="button" id="syCalToday" title="回到有数据的最近一月" style="width:auto;padding:0 10px;font-size:12px;">本月</button>
            <button type="button" id="syCalNext" title="下一月">›</button>
          </div>
        </div>
        <div class="cal-weekdays">
          <span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span>
        </div>
        <div class="cal-grid" id="syCalGrid"></div>
        <div class="cal-legend">
          <span class="mark"><i></i> 有生意经采集</span>
          <span id="syCalStat"></span>
        </div>
      </aside>

      <section class="card day-card" id="syDayCard">
        <div class="day-hd">
          <h2>生意经榜单 <span class="date-pill" id="syBriefDate">—</span></h2>
          <span class="meta" id="syDayHint" style="color:var(--muted);font-size:12px;"></span>
        </div>
        <div style="padding:10px 16px 0;">
          <div class="sy-meta-row" id="syMeta"></div>
          <div class="sy-chips" id="syChips" role="tablist" aria-label="品类"></div>
        </div>
        <div class="day-posts" style="max-height:none;padding:4px 12px 16px;">
          <div class="sy-lists" id="syLists"></div>
        </div>
      </section>
    </div>
  </div><!-- /mode-shengyijing -->

  <div class="footer-note" id="footerNote"></div>
</div>

<script>
(function () {
  const D = window.DASHBOARD_DATA;
  if (!D) {
    document.body.innerHTML = '<p style="padding:40px;text-align:center;color:#c00">缺少 data.js，请先运行 build_dashboard_data.py</p>';
    return;
  }

  const dataDays = new Set(D.dates || []);
  const syDays = new Set(D.shengyijing_dates || []);
  const syCatOrder = D.shengyijing_category_order || [
    '火锅', '地方菜', '热门/特色菜', '自助餐', '饮品', '快餐小吃'
  ];

  let mode = 'duibiao'; // duibiao | shengyijing
  let selectedDate = D.default_date || (D.dates && D.dates[D.dates.length - 1]) || null;
  let sySelectedDate = D.shengyijing_default_date
    || (D.shengyijing_dates && D.shengyijing_dates[D.shengyijing_dates.length - 1])
    || null;
  let syCategory = syCatOrder[0] || '火锅';
  let viewYear, viewMonth; // 0-based month (对标)
  let syViewYear, syViewMonth;
  let range = 'all';
  const SORT_KEY = 'duibiao_post_sort';
  const SORT_OPTS = ['latest', 'plays', 'interactions'];
  function loadSort() {
    try {
      const v = localStorage.getItem(SORT_KEY);
      if (SORT_OPTS.includes(v)) return v;
    } catch (_) {}
    return 'latest';
  }
  let sort = loadSort();

  function syncSortButtons() {
    document.querySelectorAll('#daySortSeg button, #sortSeg button').forEach(b => {
      b.classList.toggle('active', b.getAttribute('data-sort') === sort);
    });
  }

  function setSort(next) {
    if (!SORT_OPTS.includes(next) || next === sort) {
      syncSortButtons();
      return;
    }
    sort = next;
    try { localStorage.setItem(SORT_KEY, sort); } catch (_) {}
    syncSortButtons();
    renderDay();
    renderFeed();
  }

  function sortPosts(list) {
    const posts = (list || []).slice();
    if (sort === 'plays') {
      posts.sort((a, b) => (Number(b.plays) || 0) - (Number(a.plays) || 0));
    } else if (sort === 'interactions') {
      posts.sort((a, b) => (Number(b.interactions) || 0) - (Number(a.interactions) || 0));
    } else {
      posts.sort((a, b) => String(b.published_at || '').localeCompare(String(a.published_at || '')));
    }
    return posts;
  }

  function initViewMonthFrom(anchor, setter) {
    if (anchor) {
      const p = anchor.split('-').map(Number);
      setter(p[0], p[1] - 1);
    } else {
      const now = new Date();
      setter(now.getFullYear(), now.getMonth());
    }
  }
  function initViewMonth() {
    initViewMonthFrom(selectedDate || (D.dates && D.dates[D.dates.length - 1]), (y, m) => {
      viewYear = y; viewMonth = m;
    });
  }
  function initSyViewMonth() {
    initViewMonthFrom(sySelectedDate || (D.shengyijing_dates && D.shengyijing_dates[D.shengyijing_dates.length - 1]), (y, m) => {
      syViewYear = y; syViewMonth = m;
    });
  }
  initViewMonth();
  initSyViewMonth();

  const fmt = (n) => {
    if (n == null || n === '') return '—';
    const x = Number(n);
    if (Number.isNaN(x)) return '—';
    if (x >= 10000) {
      const v = x / 10000;
      return (v >= 10 ? v.toFixed(0) : v.toFixed(1).replace(/\.0$/, '')) + '万';
    }
    return x.toLocaleString('zh-CN');
  };
  const escapeHtml = (s) => String(s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
  const dash = (v) => (v == null || v === '' ? '<span class="dash">—</span>' : escapeHtml(String(v)));

  function pad2(n) { return String(n).padStart(2, '0'); }
  function ymd(y, m0, d) {
    return y + '-' + pad2(m0 + 1) + '-' + pad2(d);
  }
  function todayYmd() {
    const n = new Date();
    return ymd(n.getFullYear(), n.getMonth(), n.getDate());
  }

  function metricIcons(p) {
    const parts = [
      `👍 ${fmt(p.likes)}`,
      `💬 ${fmt(p.comments)}`,
      `⭐ ${fmt(p.collects)}`,
      `↪ ${fmt(p.shares)}`,
    ];
    if (p.plays != null) parts.push(`▶ ${fmt(p.plays)}`);
    return parts.map(t => `<span>${t}</span>`).join('');
  }

  function buildCalendarCells(y, m0) {
    const first = new Date(y, m0, 1);
    let startPad = first.getDay() - 1;
    if (startPad < 0) startPad = 6;
    const daysInMonth = new Date(y, m0 + 1, 0).getDate();
    const prevDays = new Date(y, m0, 0).getDate();
    const cells = [];
    for (let i = 0; i < startPad; i++) {
      const d = prevDays - startPad + 1 + i;
      cells.push({ day: d, inMonth: false, date: null });
    }
    for (let d = 1; d <= daysInMonth; d++) {
      cells.push({ day: d, inMonth: true, date: ymd(y, m0, d) });
    }
    while (cells.length % 7 !== 0) {
      cells.push({ day: cells.length, inMonth: false, date: null });
    }
    while (cells.length < 42) {
      cells.push({ day: 0, inMonth: false, date: null });
    }
    return cells.slice(0, 42);
  }

  function renderCalendarGeneric(opts) {
    const {
      labelEl, gridEl, statEl, year, month, selected, daySet, legendHas, onSelect
    } = opts;
    labelEl.textContent = year + '年' + (month + 1) + '月';
    const today = todayYmd();
    const cells = buildCalendarCells(year, month);
    gridEl.innerHTML = cells.map(c => {
      if (!c.inMonth) {
        return `<button type="button" class="cal-cell" disabled tabindex="-1"><span class="day-num">${c.day || ''}</span><span class="dot empty"></span></button>`;
      }
      const has = daySet.has(c.date);
      const cls = [
        'cal-cell', 'in-month',
        has ? 'has-data' : '',
        c.date === selected ? 'selected' : '',
        c.date === today ? 'today' : '',
      ].filter(Boolean).join(' ');
      return `<button type="button" class="${cls}" data-date="${c.date}" title="${c.date}${has ? ' · ' + legendHas : ''}">
        <span class="day-num">${c.day}</span>
        <span class="dot ${has ? '' : 'empty'}"></span>
      </button>`;
    }).join('');
    gridEl.querySelectorAll('button[data-date]').forEach(btn => {
      btn.addEventListener('click', () => onSelect(btn.getAttribute('data-date')));
    });
    const withDataInView = [...daySet].filter(d => {
      const [yy, mm] = d.split('-').map(Number);
      return yy === year && mm === month + 1;
    }).length;
    statEl.textContent = `本月 ${withDataInView} 天有数据 · 共 ${daySet.size} 天存档`;
  }

  function renderCalendar() {
    renderCalendarGeneric({
      labelEl: document.getElementById('calMonthLabel'),
      gridEl: document.getElementById('calGrid'),
      statEl: document.getElementById('calStat'),
      year: viewYear, month: viewMonth,
      selected: selectedDate, daySet: dataDays,
      legendHas: '有早报',
      onSelect: (date) => {
        selectedDate = date;
        renderDay();
        renderCalendar();
        if (document.getElementById('panel-feed').classList.contains('active')) {
          renderFeed();
        }
      },
    });
  }

  function renderSyCalendar() {
    renderCalendarGeneric({
      labelEl: document.getElementById('syCalMonthLabel'),
      gridEl: document.getElementById('syCalGrid'),
      statEl: document.getElementById('syCalStat'),
      year: syViewYear, month: syViewMonth,
      selected: sySelectedDate, daySet: syDays,
      legendHas: '有生意经',
      onSelect: (date) => {
        sySelectedDate = date;
        const day = (D.shengyijing_by_day || {})[sySelectedDate];
        if (day && day.category_order && day.category_order.length) {
          if (!day.category_order.includes(syCategory)) {
            syCategory = day.category_order[0];
          }
        }
        renderSyDay();
        renderSyCalendar();
      },
    });
  }

  function renderDay() {
    document.getElementById('briefDate').textContent = selectedDate || '—';
    const hasBrief = selectedDate && dataDays.has(selectedDate);
    const s = (D.day_summaries && D.day_summaries[selectedDate]) || {
      accounts_updated: 0, new_posts: 0, interactions: 0, plays: null, likes: 0
    };
    const kpis = document.getElementById('kpis');
    const playLabel = s.plays != null ? fmt(s.plays) : '—';
    kpis.innerHTML = `
      <div class="kpi"><div class="n">${hasBrief ? (s.accounts_updated || 0) : '—'}</div><div class="l">有更新账号</div></div>
      <div class="kpi"><div class="n">${hasBrief ? (s.new_posts || 0) : '—'}</div><div class="l">新增作品</div></div>
      <div class="kpi"><div class="n">${hasBrief ? fmt(s.interactions || 0) : '—'}</div><div class="l">互动合计</div></div>
      <div class="kpi"><div class="n">${hasBrief ? playLabel : '—'}</div><div class="l">播放合计</div></div>
    `;

    const hint = document.getElementById('dayHint');
    const posts = sortPosts((D.posts_by_day && D.posts_by_day[selectedDate]) || []);
    const daySortBar = document.getElementById('daySortBar');
    if (daySortBar) daySortBar.style.display = hasBrief ? '' : 'none';
    if (hasBrief) {
      hint.textContent = posts.length ? `${posts.length} 条新增作品` : '有早报 · 无入库作品';
    } else {
      hint.textContent = '当日无早报数据';
    }

    const box = document.getElementById('dayPosts');
    if (!hasBrief) {
      box.innerHTML = `<div class="empty-hint"><strong>暂无数据</strong>该日尚未采集早报。日历上有蓝点的日期可点选查看。</div>`;
      return;
    }
    if (!posts.length) {
      box.innerHTML = '<div class="empty-hint"><strong>当日无新增作品</strong>已跑早报，但无作品入库（或均已不在当前对标库）。</div>';
      return;
    }
    box.innerHTML = posts.map(p => {
      const link = p.url
        ? `<a href="${escapeHtml(p.url)}" target="_blank" rel="noopener">抖音</a>`
        : '';
      return `<div class="day-post">
        <div>
          <div class="title">${escapeHtml(p.title || '（无标题）')}</div>
          <div class="sub">
            <strong>${escapeHtml(p.nickname || '')}</strong>
            <span>${escapeHtml(p.published_at || '')}</span>
            <span class="tag-new">新增</span>
            ${link}
          </div>
        </div>
        <div class="metrics">${metricIcons(p)}</div>
      </div>`;
    }).join('');
  }

  function syRowHtml(item, opts) {
    opts = opts || {};
    const rank = item.rank != null ? item.rank : '—';
    const top = Number(rank) <= 3;
    const label = item.rankLabel
      ? `<span class="rank-label">${escapeHtml(item.rankLabel)}</span>`
      : '';
    const role = item.role
      ? `<span class="sy-role ${item.role === '商家' ? 'shangjia' : 'daren'}">${escapeHtml(item.role)}</span>`
      : '';
    const syHref = item.douyinUrl
      || (item.awemeId ? `https://www.douyin.com/video/${item.awemeId}` : '')
      || (item.videoLink && String(item.videoLink).includes('douyin.com') ? item.videoLink : '')
      || item.videoLink
      || '';
    const link = syHref
      ? `<a href="${escapeHtml(syHref)}" target="_blank" rel="noopener">${syHref.includes('douyin.com') ? '抖音' : '详情'}</a>`
      : '';
    const store = item.storeOrProduct
      ? `<span>${escapeHtml(item.storeOrProduct)}</span>`
      : '';
    return `<div class="sy-row">
      <div class="sy-rank ${top ? 'top' : ''}">${escapeHtml(String(rank))}</div>
      <div>
        <div class="title">${escapeHtml(item.title || '（无标题）')}</div>
        <div class="sub">
          <strong>${escapeHtml(item.creator || '')}</strong>
          ${role}
          ${label}
          <span>${escapeHtml(item.publishTime || '')}</span>
          ${store}
          ${link}
        </div>
        <div class="idx">
          <span>成交 <b>${escapeHtml(item.transactionIndex != null ? String(item.transactionIndex) : '—')}</b></span>
          <span>人气 <b>${escapeHtml(item.popularityIndex != null ? String(item.popularityIndex) : '—')}</b></span>
          <span>播 ${fmt(item.playCount)}</span>
          <span>赞 ${fmt(item.diggCount != null ? item.diggCount : item.newLikes)}</span>
          <span>💬 ${fmt(item.commentCount != null ? item.commentCount : item.newComments)}</span>
          <span>⭐ ${fmt(item.collectCount != null ? item.collectCount : item.newFavorites)}</span>
          <span>↪ ${fmt(item.shareCount)}</span>
        </div>
      </div>
    </div>`;
  }

  function renderSyDay() {
    document.getElementById('syBriefDate').textContent = sySelectedDate || '—';
    const has = sySelectedDate && syDays.has(sySelectedDate);
    const day = (D.shengyijing_by_day || {})[sySelectedDate];
    const meta = document.getElementById('syMeta');
    const chips = document.getElementById('syChips');
    const lists = document.getElementById('syLists');
    const hint = document.getElementById('syDayHint');

    if (!has || !day) {
      hint.textContent = '当日无生意经采集';
      meta.innerHTML = '';
      chips.innerHTML = '';
      lists.innerHTML = `<div class="empty-hint" style="grid-column:1/-1"><strong>暂无数据</strong>该日尚未采集生意经榜单。日历蓝点日期可点选。</div>`;
      return;
    }

    hint.textContent = `${day.board || '成交榜'} · ${day.period || '日榜'}`;
    meta.innerHTML = `
      <span class="sy-pill dark">${escapeHtml(day.board || '成交榜')}</span>
      <span class="sy-pill">${escapeHtml(day.period || '日榜')}</span>
      <span>统计日 <strong style="color:var(--text)">${escapeHtml(day.statDate || '—')}</strong></span>
      <span>采集日 <strong style="color:var(--text)">${escapeHtml(day.date || sySelectedDate)}</strong></span>
      <span>${escapeHtml(day.categoryParent || '美食')}</span>
      ${day.source ? `<a href="${escapeHtml(day.source)}" target="_blank" rel="noopener">来源</a>` : ''}
    `;

    const order = (day.category_order && day.category_order.length)
      ? day.category_order
      : syCatOrder;
    if (!order.includes(syCategory)) syCategory = order[0];

    chips.innerHTML = order.map(name => {
      const block = (day.categories || {})[name] || {};
      const n = (block['达人'] || []).length + (block['商家'] || []).length;
      const active = name === syCategory ? 'active' : '';
      return `<button type="button" class="${active}" data-cat="${escapeHtml(name)}">${escapeHtml(name)} · ${n}</button>`;
    }).join('');
    chips.querySelectorAll('button[data-cat]').forEach(btn => {
      btn.addEventListener('click', () => {
        syCategory = btn.getAttribute('data-cat');
        renderSyDay();
      });
    });

    const block = (day.categories || {})[syCategory] || {};
    const daren = block['达人'] || [];
    const shangjia = block['商家'] || [];
    let zongbang = block['总榜'];
    if (!Array.isArray(zongbang)) {
      zongbang = syBuildZongbang(daren, shangjia);
    }
    lists.innerHTML = `
      <div class="card sy-col">
        <div class="sy-col-hd">达人 TOP5 <span class="badge">${daren.length}</span></div>
        ${daren.length ? daren.map(syRowHtml).join('') : '<div class="empty-hint">暂无达人数据</div>'}
      </div>
      <div class="card sy-col">
        <div class="sy-col-hd">商家 TOP5 <span class="badge">${shangjia.length}</span></div>
        ${shangjia.length ? shangjia.map(syRowHtml).join('') : '<div class="empty-hint">暂无商家数据</div>'}
      </div>
      <div class="card sy-col sy-total">
        <div class="sy-col-hd">类目总榜 <span class="badge">${zongbang.length}</span></div>
        ${zongbang.length ? zongbang.map(syRowHtml).join('') : '<div class="empty-hint">暂无总榜数据</div>'}
      </div>
    `;
  }

  function syBuildZongbang(daren, shangjia) {
    const merged = [];
    (daren || []).forEach(it => merged.push(Object.assign({}, it, { role: '达人' })));
    (shangjia || []).forEach(it => merged.push(Object.assign({}, it, { role: '商家' })));
    const num = (v) => (typeof v === 'number' && !isNaN(v) ? v : -1);
    merged.sort((a, b) => {
      const pa = num(a.playCount), pb = num(b.playCount);
      if (pb !== pa) return pb - pa;
      const oa = num(a.popularityIndex), ob = num(b.popularityIndex);
      if (ob !== oa) return ob - oa;
      const da = num(a.diggCount != null ? a.diggCount : a.newLikes);
      const db = num(b.diggCount != null ? b.diggCount : b.newLikes);
      return db - da;
    });
    return merged.map((it, i) => Object.assign({}, it, { rank: i + 1 }));
  }

  function renderCategories() {
    document.getElementById('libHint').textContent =
      `共 ${D.target_count} 个账号 · 按品类启发式分组`;
    const root = document.getElementById('categories');
    const cats = (D.categories || []).filter(c => c.count > 0);
    root.innerHTML = cats.map(c => {
      const rows = (c.accounts || []).map(a => {
        const profile = a.profile_url
          ? `<a href="${escapeHtml(a.profile_url)}" target="_blank" rel="noopener">主页</a>`
          : '';
        const share = a.share_url
          ? `<a href="${escapeHtml(a.share_url)}" target="_blank" rel="noopener">分享</a>`
          : '';
        return `<tr>
          <td>
            <div class="acct-name">${escapeHtml(a.nickname)}</div>
            <div class="acct-id">@${escapeHtml(a.douyin_id || '')}</div>
          </td>
          <td>${dash(a.followers != null ? fmt(a.followers) : null)}</td>
          <td>${dash(a.total_likes != null ? fmt(a.total_likes) : null)}</td>
          <td>${dash(a.works_total)}</td>
          <td>${a.stored_posts || 0}</td>
          <td class="ops">${profile}${share}</td>
        </tr>`;
      }).join('');
      return `<div class="card cat-block">
        <div class="cat-hd" style="background:${c.bg};color:${c.fg}">
          <span>${escapeHtml(c.name)} · ${c.count} 账号</span>
          <span class="right">入库作品合计 ${c.stored_sum}</span>
        </div>
        <table class="acct">
          <thead>
            <tr>
              <th style="width:32%">账号</th>
              <th>粉丝</th>
              <th>获赞</th>
              <th>作品</th>
              <th>入库</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody>${rows || '<tr><td colspan="6" class="empty-hint">无账号</td></tr>'}</tbody>
        </table>
      </div>`;
    }).join('');
  }

  function parseDay(s) {
    if (!s) return null;
    const m = String(s).match(/^(\d{4})-(\d{2})-(\d{2})/);
    if (!m) return null;
    return new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
  }

  function renderFeed() {
    let posts = (D.all_posts || []).slice();
    const anchor = selectedDate ? parseDay(selectedDate) : new Date();
    if (range === '7' || range === '30') {
      const days = range === '7' ? 7 : 30;
      const start = new Date(anchor);
      start.setDate(start.getDate() - (days - 1));
      posts = posts.filter(p => {
        const d = parseDay(p.published_at || p.day);
        return d && d >= start && d <= anchor;
      });
    }
    posts = sortPosts(posts);
    document.getElementById('feedCount').textContent = `共 ${posts.length} 条`;
    const feed = document.getElementById('feed');
    if (!posts.length) {
      feed.innerHTML = '<div class="card empty-hint">当前筛选下无作品</div>';
      return;
    }
    feed.innerHTML = posts.map(p => {
      const dur = p.duration_sec != null ? `时长 ${p.duration_sec}s` : '';
      const link = p.url
        ? `<a href="${escapeHtml(p.url)}" target="_blank" rel="noopener">抖音链接</a>`
        : '';
      return `<article class="feed-card">
        <div class="cap">${escapeHtml(p.title || '（无标题）')}</div>
        <div class="meta-row">
          <span>${escapeHtml(p.nickname || '')}</span>
          <span>${escapeHtml(p.published_at || p.day || '')}</span>
          <span>${dur}</span>
          ${link}
        </div>
        <div class="mrow">${metricIcons(p)}</div>
      </article>`;
    }).join('');
  }

  function renderMeta() {
    document.getElementById('genMeta').textContent =
      `数据生成于 ${D.generated_at || '—'}（${D.timezone || 'Asia/Shanghai'}）`;
    const syN = (D.shengyijing_dates || []).length;
    document.getElementById('footerNote').textContent =
      mode === 'shengyijing'
        ? `生意经 · 日历蓝点=有采集 · 6 品类各 达人/商家 TOP5 + 类目总榜 · 共 ${syN} 天存档 · ⌘R 刷新 App 数据`
        : `左侧日历点选日期查看当日采集 · 蓝点 = 有早报 · 粉丝/获赞/作品未采集时显示 — · ⌘R 刷新 App 数据`;
  }

  function setMode(next) {
    mode = next;
    document.querySelectorAll('.mode-seg button').forEach(b => {
      b.classList.toggle('active', b.getAttribute('data-mode') === mode);
    });
    document.getElementById('mode-duibiao').classList.toggle('active', mode === 'duibiao');
    document.getElementById('mode-shengyijing').classList.toggle('active', mode === 'shengyijing');
    renderMeta();
    if (mode === 'shengyijing') {
      renderSyCalendar();
      renderSyDay();
    }
  }

  function renderAll() {
    renderMeta();
    renderCalendar();
    renderDay();
    renderCategories();
    renderFeed();
    renderSyCalendar();
    renderSyDay();
  }

  document.getElementById('calPrev').addEventListener('click', () => {
    viewMonth -= 1;
    if (viewMonth < 0) { viewMonth = 11; viewYear -= 1; }
    renderCalendar();
  });
  document.getElementById('calNext').addEventListener('click', () => {
    viewMonth += 1;
    if (viewMonth > 11) { viewMonth = 0; viewYear += 1; }
    renderCalendar();
  });
  document.getElementById('calToday').addEventListener('click', () => {
    initViewMonth();
    renderCalendar();
  });

  document.getElementById('syCalPrev').addEventListener('click', () => {
    syViewMonth -= 1;
    if (syViewMonth < 0) { syViewMonth = 11; syViewYear -= 1; }
    renderSyCalendar();
  });
  document.getElementById('syCalNext').addEventListener('click', () => {
    syViewMonth += 1;
    if (syViewMonth > 11) { syViewMonth = 0; syViewYear += 1; }
    renderSyCalendar();
  });
  document.getElementById('syCalToday').addEventListener('click', () => {
    initSyViewMonth();
    renderSyCalendar();
  });

  document.querySelectorAll('.mode-seg button').forEach(btn => {
    btn.addEventListener('click', () => setMode(btn.getAttribute('data-mode')));
  });

  document.querySelectorAll('.sec-tabs button').forEach(btn => {
    btn.addEventListener('click', () => {
      const tab = btn.getAttribute('data-tab');
      document.querySelectorAll('.sec-tabs button').forEach(b => b.classList.toggle('active', b === btn));
      document.querySelectorAll('.sec-panel').forEach(p => {
        p.classList.toggle('active', p.id === 'panel-' + tab);
      });
      if (tab === 'feed') renderFeed();
    });
  });

  document.getElementById('rangeSeg').addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-range]');
    if (!btn) return;
    range = btn.getAttribute('data-range');
    document.querySelectorAll('#rangeSeg button').forEach(b => b.classList.toggle('active', b === btn));
    renderFeed();
  });
  function onSortClick(e) {
    const btn = e.target.closest('button[data-sort]');
    if (!btn) return;
    setSort(btn.getAttribute('data-sort'));
  }
  document.getElementById('sortSeg').addEventListener('click', onSortClick);
  document.getElementById('daySortSeg').addEventListener('click', onSortClick);
  document.getElementById('btnRefresh').addEventListener('click', () => renderAll());

  syncSortButtons();
  renderAll();
})();
</script>
</body>
</html>
